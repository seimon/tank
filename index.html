<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';

// ---------------------------------------------------------------- 기본 설정
const HALF = 75;              // 보드 반경 (150m x 150m)
const N = 301, STEP = 0.5;    // 지형 격자 (0.5m 간격)
const ROAD_HW = 2.2;          // 도로 반폭
const CREEK_HW = 2.4;         // 시냇물 기준 반폭 (다리 자리, 탱크 길이의 1.5배 정도). 상류로 갈수록 넓어진다
let CREEK_UP = 1;             // 상류 쪽 x 방향
const BOTTOM = -6;            // 보드 바닥 높이
const SPAWN_Z = -48;          // 탱크 출발 지점 (본도로 남쪽)
const WALL = HALF - 0.05;     // 보드 경계의 투명한 벽
const params = new URLSearchParams(location.search);
const GRASS_TARGET = Math.round((+params.get('grass') || 1) * 165000);
const UVW = (v) => `((${v} + ${HALF.toFixed(1)}) / ${(HALF * 2).toFixed(1)})`;   // 월드 xz → 필드 텍스처 uv (GLSL)
let lowH = 300;

let seed = 20261027;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rand();
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// 모든 머티리얼이 공유하는 유니폼
const U = {
  uTime: { value: 0 },
  uSnap: { value: new THREE.Vector2(160, 120) },
  uWindDir: { value: new THREE.Vector2(0.8, 0.6).normalize() },
  uWind: { value: 1 },
  uField: { value: null },
  uTrack: { value: null },
  uPointScale: { value: 300 },
  uAO: { value: 1.8 },   // 구운 그늘(버텍스 컬러 AO) 세기: 0 = 없음, 1 = 구운 그대로, 그 이상은 더 진하게
  uWhite: { value: 0 },  // 1이면 연기·불꽃 말고 모든 물체의 색·텍스처를 흰색으로 (그늘만 보기)
  uGap: { value: null }, // 건물 사이 틈·벽 밑동의 바닥 그늘 텍스처
  uBlast: { value: [0, 1, 2, 3].map(() => new THREE.Vector4(0, 0, -100, 1)) },   // 풀을 눕히는 폭풍: x, z, 시각, 반경
  // 바닥 그림자(컨택트 쉐도우): 0 = x, z, cos, sin(방향) / 1 = 반폭, 반길이, 진하기
  uSh0: { value: Array.from({ length: 12 }, () => new THREE.Vector4()) },
  uSh1: { value: Array.from({ length: 12 }, () => new THREE.Vector4()) },
  uLamp0: { value: [new THREE.Vector4(), new THREE.Vector4()] },   // 탱크 뒷등 빛 (내 탱크, 적 탱크)
  uLamp1: { value: [new THREE.Vector4(), new THREE.Vector4()] },
};
// 탱크·금고 밑의 부드러운 둥근 사각형 그림자. 지면과 풀 셰이더가 같은 식으로 어둡게 한다 (겹친 면이 없어 z-fighting 없음)
const SHADOW_GLSL = `
  uniform vec4 uSh0[12], uSh1[12];
  float contactShadow(vec2 p) {
    float s = 0.0;
    for (int i = 0; i < 12; i++) {
      vec4 a = uSh0[i], b = uSh1[i];
      if (b.z <= 0.0) continue;
      vec2 d = p - a.xy, l = vec2(d.x * a.z - d.y * a.w, d.x * a.w + d.y * a.z);
      float r = min(b.x, b.y) * 0.6;
      vec2 q = abs(l) - b.xy + r;
      float dist = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
      s = max(s, (1.0 - smoothstep(-0.4, 1.5, dist)) * b.z);
    }
    return s;
  }
  // 브레이크등·후진등이 탱크 뒤 바닥에 드리우는 빛: 탱크 방향을 따라 뒤로 길쭉하게, 뒷면에 가까울수록 밝게
  // uLamp0 = (x, z, cos yaw, sin yaw), uLamp1 = (빛 색 rgb, 뻗는 길이. 0이면 꺼짐)
  uniform vec4 uLamp0[2], uLamp1[2];
  vec3 lampGlow(vec2 p) {
    vec3 s = vec3(0.0);
    for (int i = 0; i < 2; i++) {
      vec4 a = uLamp0[i], b = uLamp1[i];
      if (b.w <= 0.0) continue;
      vec2 d = p - a.xy;
      float lx = d.x * a.z - d.y * a.w, back = -(d.x * a.w + d.y * a.z) - 2.0;   // back: 차체 뒷면에서 뒤로 잰 거리
      float k = smoothstep(-0.4, 0.3, back) * (1.0 - smoothstep(0.0, b.w, back)) * (1.0 - smoothstep(1.2 + back * 0.25, 2.6 + back * 0.4, abs(lx)));
      s += b.rgb * k * k;
    }
    return s;
  }
`;

// PS1식 정점 스내핑: 클립 좌표를 저해상도 격자에 맞춰 떨림을 만든다
const SNAP = 'gl_Position.xy = floor(gl_Position.xy / gl_Position.w * uSnap + 0.5) / uSnap * gl_Position.w;';
function ps1(mat, extra, key) {
  mat.onBeforeCompile = function (sh) {   // this = 컴파일되는 재질 (복제본도 같은 함수를 쓴다)
    sh.uniforms.uSnap = U.uSnap;
    sh.vertexShader = 'uniform vec2 uSnap;\n' +
      sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n' + SNAP);
    if (extra) extra(sh);
    sh.uniforms.uAO = U.uAO; sh.uniforms.uWhite = U.uWhite;
    sh.fragmentShader = 'uniform float uAO, uWhite;\n' + sh.fragmentShader;
    if (this && this.defines && 'AO_BAKED' in this.defines) {
      // AO를 구운 재질: 정점 색을 uAO 거듭제곱으로 곱한다. 세기를 1보다 올려도 음수가 되지 않고 어두운 곳일수록 더 진해진다.
      // 값만 바뀌니 토글·슬라이더로 셰이더를 다시 만들지 않는다
      sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>',
        'diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.9), uWhite);\ndiffuseColor.rgb *= pow(vColor, vec3(uAO));');
    } else if (!(this && this.userData.ownWhite)) {
      // 나머지 재질은 모든 색 처리가 끝난 뒤 흰색으로 (발광은 그대로)
      sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>', 'diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.9), uWhite);\n#include <emissivemap_fragment>');
    }
  };
  if (key) mat.customProgramCacheKey = () => key;
  return mat;
}
const lambert = (o) => ps1(new THREE.MeshLambertMaterial(o));

// ---------------------------------------------------------------- 지형
const HILLS = [
  { x: -46, z: -45, a: 8, r: 13 }, { x: 50, z: 50, a: 9.5, r: 15 }, { x: 54, z: -42, a: 6, r: 10 },
  { x: -54, z: 50, a: 7, r: 14 }, { x: -14, z: 62, a: 4.5, r: 9 }, { x: 21, z: -63, a: 5, r: 10 },
  { x: -60, z: -5, a: 4, r: 9 }, { x: 30, z: -20, a: 3, r: 8 },
  { x: 55, z: 6, a: 6, r: 8 },     // 둥근 언덕
];
function baseH(x, z) {
  let h = 4;
  h += 2.8 * Math.sin(x * 0.03 + 1.3) * Math.cos(z * 0.033 - 0.7);
  h += 1.3 * Math.sin(x * 0.075 + z * 0.05 + 2.1);
  h += 0.5 * Math.sin(x * 0.2 - z * 0.17 + 0.4);
  for (const k of HILLS) h += k.a * Math.exp(-((x - k.x) ** 2 + (z - k.z) ** 2) / (2 * k.r * k.r));
  return h;
}
const TOWN_H = baseH(0, 0);
// 마을 주변은 평평하게
const preH = (x, z) => lerp(TOWN_H, baseH(x, z), smooth(24, 36, Math.hypot(x, z)));
// 마을 영향 (1=마을 한가운데). 경계를 노이즈로 흔들어 정확한 원이 보이지 않게
function townAt(x, z) {
  const n = Math.sin(x * 0.21 + 1.3) * Math.sin(z * 0.17 + 0.4) * 0.6 + Math.sin(x * 0.47 - z * 0.39 + 2.0) * 0.4;
  return 1 - smooth(14, 30, Math.hypot(x, z) + n * 7);
}

// S자 본도로: 마을 구간(|z|<14)은 곧게, 바깥은 휘어지며 약간 울퉁불퉁
function mainRoadX0(z) {
  const a = Math.abs(z);
  const s = Math.sign(z) * smooth(14, 60, a);
  const j = (2.2 * Math.sin(z * 0.17 + 0.5) + 1.1 * Math.sin(z * 0.41 + 1.7) + 0.5 * Math.sin(z * 0.93 + 0.2)) * smooth(16, 26, a);
  return 33 * s + j;
}
// 다리 자리 = 원래 도로가 시냇물과 만나는 곳. 그 앞뒤로 도로를 시냇물과 수직이 되게 펴서 다리가 똑바로 건넌다
const creekZ = (x) => 33 + 3.5 * Math.sin(x * 0.055 + 0.8) + 1.8 * Math.sin(x * 0.13 + 2.3) + 0.7 * Math.sin(x * 0.31);
let XB_Z = 33;
for (let k = 0; k < 40; k++) XB_Z = creekZ(mainRoadX0(XB_Z));
const XB_X = mainRoadX0(XB_Z), XB_SLOPE = -(creekZ(XB_X + 0.5) - creekZ(XB_X - 0.5));
function mainRoadX(z) {
  return lerp(mainRoadX0(z), XB_X + (z - XB_Z) * XB_SLOPE, 1 - smooth(6, 20, Math.abs(z - XB_Z)));
}
// 마을 중앙에서 서쪽으로 T자 갈림길
function branchZ(x) {
  const a = Math.abs(x);
  return (4.5 * Math.sin(a * 0.05) + 1.6 * Math.sin(a * 0.23 + 1.1) + 0.6 * Math.sin(a * 0.6)) * smooth(8, 20, a);
}
// 마을 북쪽을 서→동으로 가로지르는 시냇물 (creekZ는 위에)
const mainPoly = [], branchPoly = [], creekPoly = [];
for (let z = -HALF - 4; z <= HALF + 4; z += 0.75) mainPoly.push({ x: mainRoadX(z), z });
for (let x = 0; x >= -HALF - 4; x -= 0.75) branchPoly.push({ x, z: branchZ(x) });
for (let x = -HALF - 4; x <= HALF + 4; x += 0.75) creekPoly.push({ x, z: creekZ(x) });

// 길 방향으로 높이를 부드럽게
function smoothHeights(poly, passes, win) {
  let ys = poly.map(p => preH(p.x, p.z));
  for (let pass = 0; pass < passes; pass++) {
    ys = ys.map((_, i) => {
      let s = 0, c = 0;
      for (let k = -win; k <= win; k++) { const j = i + k; if (j >= 0 && j < ys.length) { s += ys[j]; c++; } }
      return s / c;
    });
  }
  poly.forEach((p, i) => p.y = ys[i]);
}
smoothHeights(mainPoly, 4, 6); smoothHeights(branchPoly, 4, 6); smoothHeights(creekPoly, 8, 10);
// 물은 지면보다 1m쯤 아래로, 높은 쪽에서 낮은 쪽으로만 흐르게
{
  const c = creekPoly, down = c[0].y > c[c.length - 1].y;
  const order = down ? c : [...c].reverse();
  order[0].y -= 1.1;
  for (let i = 1; i < order.length; i++) order[i].y = Math.min(order[i].y - 1.1, order[i - 1].y - 0.004);
  // 반폭: 상류 쪽으로 갈수록 넓어져 끝에서 2배, 군데군데 불규칙하게 넓었다 좁았다. 다리 근처는 원래 폭
  CREEK_UP = down ? -1 : 1;
  const span = HALF - CREEK_UP * XB_X;
  for (const p of c) {
    const far = smooth(4, 14, Math.abs(p.x - XB_X));
    const wob = 1 + (0.22 * Math.sin(p.x * 0.19 + 0.7) + 0.12 * Math.sin(p.x * 0.53 + 2.1)) * far;
    p.w = CREEK_HW * (1 + 3 * smooth(4, span, (p.x - XB_X) * CREEK_UP)) * wob;
  }
  // 물길을 따라 잰 거리 (물결 무늬가 흐르는 방향)
  c.forEach((p, i) => { p.s = i ? c[i - 1].s + Math.hypot(p.x - c[i - 1].x, p.z - c[i - 1].z) : 0; });
}
// 본도로와 시냇물이 만나는 곳 = 다리. 물은 다리 밑으로 충분히 낮게
let ci = 0;
creekPoly.forEach((p, i) => { if (Math.hypot(p.x - XB_X, p.z - XB_Z) < Math.hypot(creekPoly[ci].x - XB_X, creekPoly[ci].z - XB_Z)) ci = i; });
const BRIDGE = { x: XB_X, z: XB_Z };
{
  const rp = mainPoly.reduce((m, p) => Math.hypot(p.x - BRIDGE.x, p.z - BRIDGE.z) < Math.hypot(m.x - BRIDGE.x, m.z - BRIDGE.z) ? p : m);
  BRIDGE.roadY = rp.y;
  const lack = creekPoly[ci].y - (rp.y - 1.4);
  if (lack > 0) creekPoly.forEach((p, i) => { p.y -= lack * Math.exp(-(((i - ci) * 0.75 / 9) ** 2)); });
  const dz = 1, ang = Math.atan2(mainRoadX(BRIDGE.z + dz) - mainRoadX(BRIDGE.z - dz), 2 * dz);
  BRIDGE.ang = ang; BRIDGE.c = Math.cos(ang); BRIDGE.s = Math.sin(ang);
  // 비스듬히 건너면 그만큼 다리가 길어진다
  const a = creekPoly[ci - 1], b = creekPoly[ci + 1], cl = Math.hypot(b.x - a.x, b.z - a.z);
  BRIDGE.sinX = Math.max(0.5, Math.abs(BRIDGE.s * (b.z - a.z) - BRIDGE.c * (b.x - a.x)) / cl);
  BRIDGE.hl = (creekPoly[ci].w + 2.2) / BRIDGE.sinX; BRIDGE.hw = 3.6; BRIDGE.top = rp.y + 0.28;
}

// 격자마다 도로/시냇물까지의 거리, 도로 높이, 수면 높이
function nearestOnSegs(segs, x, z, out) {
  let best = 1e9, by = 0, bw = 0, bs = 0, side = 1;
  for (let s = 0; s < segs.length; s += 2) {
    const a = segs[s], b = segs[s + 1];
    const ex = b.x - a.x, ez = b.z - a.z;
    let t = ((x - a.x) * ex + (z - a.z) * ez) / (ex * ex + ez * ez);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const dx = x - a.x - ex * t, dz = z - a.z - ez * t, d2 = dx * dx + dz * dz;
    if (d2 < best) {
      best = d2; by = a.y + (b.y - a.y) * t;
      if (a.w !== undefined) { bw = a.w + (b.w - a.w) * t; bs = a.s + (b.s - a.s) * t; side = ex * dz - ez * dx < 0 ? -1 : 1; }
    }
  }
  out.d = Math.sqrt(best); out.y = by; out.w = bw; out.s = bs; out.side = side;
  return out;
}
const toSegs = (polys) => { const s = []; for (const p of polys) for (let i = 1; i < p.length; i++) s.push(p[i - 1], p[i]); return s; };
const roadSegs = toSegs([mainPoly, branchPoly]), creekSegs = toSegs([creekPoly]);
const roadD = new Float32Array(N * N), hG = new Float32Array(N * N);
const creekD = new Float32Array(N * N), waterY = new Float32Array(N * N);
const creekS = new Float32Array(N * N), creekLat = new Float32Array(N * N), creekWd = new Float32Array(N * N);   // 물결 좌표: 물길 방향 거리, 가로 위치, 기준보다 넓은 폭
{
  const r = {}, c = {};
  for (let iz = 0; iz < N; iz++) for (let ix = 0; ix < N; ix++) {
    const x = -HALF + ix * STEP, z = -HALF + iz * STEP, i = iz * N + ix;
    nearestOnSegs(roadSegs, x, z, r);
    // 시냇물은 대략 z=26~42 띠 안에만 있으니 멀면 계산 생략

          diffuseColor.rgb = mix(diffuseColor.rgb, rock, smoothstep(0.0, 0.45, vCliff));
        }
        // 물속: 깊을수록 푸르게 가라앉는 색
        float depth = vCreek.y;
        diffuseColor.rgb *= mix(vec3(1.0), vec3(0.72, 0.84, 0.88), smoothstep(0.0, 0.6, depth));
        float roadM = 1.0 - smoothstep(${(ROAD_HW - 0.4).toFixed(2)}, ${(ROAD_HW + 0.5).toFixed(2)}, vRoad + (vnoise(vXZ * 0.9) - 0.5) * 0.8);
        float rutC = 0.95 + (vnoise(vXZ * 0.3) - 0.5) * 0.7 + (vnoise(vXZ * 1.1 + 7.0) - 0.5) * 0.25;
        float rut = (1.0 - smoothstep(0.06, 0.32, abs(vRoad - rutC))) * smoothstep(0.3, 0.65, vnoise(vXZ * 0.45 + 31.0));
        float hump = (1.0 - smoothstep(0.0, 0.45, vRoad)) * vnoise(vXZ * 2.3);
        float grain = vnoise(vXZ * 3.3) * 0.6 + vnoise(vXZ * 9.0) * 0.4;
        diffuseColor.rgb *= 0.9 + 0.2 * grain;
        diffuseColor.rgb *= 1.0 - roadM * (rut * 0.3 - hump * 0.08 + (vnoise(vXZ * 0.6 + 3.0) - 0.5) * 0.25);
        diffuseColor.rgb *= 1.0 - texture2D(uTrack, ${UVW("vXZ")}).r * 0.5;
        vec4 fld = texture2D(uField, ${UVW("vXZ")});
        diffuseColor.rgb *= 1.0 - fld.b * 0.8;
        // 물웅덩이: 울퉁불퉁한 가장자리, 둘레는 젖어서 진하고 안은 어두운 하늘이 비친다
        float pud = 0.0, wet = 0.0;
        for (int i = 0; i < ${PUDDLES.length}; i++) {
          vec3 P = uPud[i];
          float r = length(vXZ - P.xy) / P.z + (vnoise(vXZ * 1.8 + float(i) * 13.0) - 0.5) * 0.5;
          pud = max(pud, 1.0 - smoothstep(0.8, 0.9, r));
          wet = max(wet, 1.0 - smoothstep(0.9, 1.35, r));
        }
        diffuseColor.rgb *= 1.0 - wet * 0.5;
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.012, 0.014, 0.018), pud);
        float shade = (1.0 - 0.8 * contactShadow(vXZ)) * pow(texture2D(uGap, ${UVW("vXZ")}).r, uAO);   // 바닥 그림자 × 건물 사이 그늘
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.9), uWhite) * shade;`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += vec3(1.4, 0.4, 0.08) * fld.g * 0.7;
        totalEmissiveRadiance += diffuseColor.rgb * lampGlow(vXZ) * 2.6;   // 뒷등 빛을 받은 땅
        if (pud > 0.0) {
          float rp = vnoise(vXZ * 7.0 + vec2(uTime * 0.8, uTime * 0.3));
          totalEmissiveRadiance += (vec3(0.012, 0.016, 0.026) + vec3(0.08, 0.09, 0.1) * smoothstep(0.84, 0.9, rp)) * pud;
        }
        // 흐르는 물빛이 바닥에 일렁이는 무늬 (커스틱)
        if (depth > 0.01) {
          vec2 q = vXZ * 1.4;
          float cs = 1.0 - abs(vnoise(q + vec2(uTime * 0.7, uTime * 0.2)) - vnoise(q * 1.3 - vec2(uTime * 0.3, uTime * 0.5)));
          totalEmissiveRadiance += vec3(0.35, 0.5, 0.55) * pow(cs, 16.0) * smoothstep(0.0, 0.15, depth) * 0.04;   // 아주 은은하게
        }`);
  }, 'terrain');
  mat.userData.ownWhite = true;   // 흰색 보기는 위 셰이더가 그늘을 남기며 직접 처리
  scene.add(new THREE.Mesh(geo, mat));
}

// 디오라마 단면 (지층 3단): 위 겉흙 / 가운데 흙(자갈·잔뿌리) / 아래 암반(바위·화석). 디테일은 단면 텍스처 두 장에 그려 둔다
{
  const secTex = (draw) => { const t = canvasTex(128, 128, draw, true); t.generateMipmaps = true; t.minFilter = THREE.NearestMipmapNearestFilter; return t; };
  const blob = (g, x, y, rx, ry, col, hi) => {
    g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rx, ry, rand() * 3, 0, 7); g.fill();
    if (hi) { g.fillStyle = hi; g.beginPath(); g.ellipse(x - rx * 0.3, y - ry * 0.35, rx * 0.45, ry * 0.3, 0, 0, 7); g.fill(); }
  };
  // 흙: 알갱이 + 자갈 + 잔뿌리 (8m 반복)
  const soilTex = secTex((g) => {
    g.fillStyle = '#d8d8d8'; g.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 900; i++) { const v = 150 + Math.floor(rand() * 100); g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(Math.floor(rand() * 128), Math.floor(rand() * 128), 1, 1); }
    for (let i = 0; i < 60; i++) { const v = 160 + Math.floor(rand() * 90); blob(g, rand() * 128, rand() * 128, 1 + rand() * 2.5, 1 + rand() * 1.5, `rgb(${v},${v - 6},${v - 14})`, 'rgba(255,255,255,.35)'); }
    g.strokeStyle = 'rgba(40,28,18,.55)'; g.lineWidth = 1;
    for (let i = 0; i < 14; i++) { let x = rand() * 128, y = rand() * 128; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 4; k++) { x += rr(-5, 5); y += rr(2, 7); g.lineTo(x, y); } g.stroke(); }
  });
  // 암반: 큰 바위 덩어리 + 금 + 화석(암모나이트, 물고기 뼈, 조개)
  const rockTex = secTex((g) => {
    g.fillStyle = '#d0d0d0'; g.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 700; i++) { const v = 140 + Math.floor(rand() * 110); g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(Math.floor(rand() * 128), Math.floor(rand() * 128), 1 + Math.floor(rand() * 2), 1); }
    for (let i = 0; i < 9; i++) { const v = 120 + Math.floor(rand() * 60); blob(g, rand() * 128, rand() * 128, 6 + rand() * 9, 4 + rand() * 6, `rgb(${v},${v},${v + 6})`, 'rgba(255,255,255,.25)'); }
    for (let i = 0; i < 30; i++) { const v = 150 + Math.floor(rand() * 80); blob(g, rand() * 128, rand() * 128, 1.5 + rand() * 2.5, 1 + rand() * 2, `rgb(${v},${v},${v})`, null); }
    g.strokeStyle = 'rgba(30,26,22,.6)';
    for (let i = 0; i < 6; i++) { let x = rand() * 128, y = rand() * 128; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 5; k++) { x += rr(-8, 8); y += rr(-3, 6); g.lineTo(x, y); } g.stroke(); }
    const bone = 'rgb(236,224,196)';
    // 암모나이트
    for (const [cx, cy, r] of [[30, 40, 7], [96, 92, 5]]) {
      g.strokeStyle = bone; g.lineWidth = 1.5; g.beginPath();
      for (let t = 0; t < 14; t += 0.2) { const rr2 = r * t / 14; g.lineTo(cx + Math.cos(t) * rr2, cy + Math.sin(t) * rr2); }
      g.stroke();
    }
    // 물고기 뼈
    g.strokeStyle = bone; g.lineWidth = 1; g.beginPath(); g.moveTo(62, 20); g.lineTo(84, 24); g.stroke();
    for (let k = 0; k < 6; k++) { g.beginPath(); g.moveTo(65 + k * 3, 21 + k * 0.5); g.lineTo(64 + k * 3, 16 + k * 0.5); g.moveTo(65 + k * 3, 21 + k * 0.5); g.lineTo(64 + k * 3, 26 + k * 0.5); g.stroke(); }
    g.fillStyle = bone; g.beginPath(); g.ellipse(86, 24, 3, 2, 0.2, 0, 7); g.fill();
    // 조개
    for (const [cx, cy] of [[20, 100], [110, 30], [70, 66]]) {
      g.fillStyle = bone; g.beginPath(); g.arc(cx, cy, 3.5, Math.PI, 0); g.fill();
      g.strokeStyle = 'rgba(80,70,55,.7)'; g.beginPath(); for (let k = -2; k <= 2; k++) { g.moveTo(cx, cy); g.lineTo(cx + k * 1.6, cy - 3.2); } g.stroke();
    }
  });
  const soil = { pos: [], nor: [], col: [], uv: [] }, rock = { pos: [], nor: [], col: [], uv: [] }, water = { pos: [], nor: [], col: [], uv: [] };
  const LAYERS = [0x3b2e1f, 0x6a4c30, 0x6c665c].map(h => new THREE.Color(h));
  const edges = [
    { n: [0, 0, 1], pt: (s) => [s, HALF] },          // +z, x 증가
    { n: [0, 0, -1], pt: (s) => [-s, -HALF] },       // -z, x 감소
    { n: [1, 0, 0], pt: (s) => [HALF, -s] },         // +x, z 감소
    { n: [-1, 0, 0], pt: (s) => [-HALF, s] },        // -x, z 증가
  ];
  const quad = (o, A, B, ya0, ya1, yb0, yb1, n, c) => {
    o.pos.push(A.x, ya0, A.z, A.x, ya1, A.z, B.x, yb0, B.z, B.x, yb0, B.z, A.x, ya1, A.z, B.x, yb1, B.z);
    o.uv.push(A.s / 8, ya0 / 8, A.s / 8, ya1 / 8, B.s / 8, yb0 / 8, B.s / 8, yb0 / 8, A.s / 8, ya1 / 8, B.s / 8, yb1 / 8);
    for (let v = 0; v < 6; v++) { o.nor.push(...n); o.col.push(c.r, c.g, c.b); }
  };
  for (const e of edges) {
    const cols = [];
    for (let k = 0; k < N; k++) {
      const s = -HALF + k * STEP, [x, z] = e.pt(s), h = heightAt(x, z);
      const w = (a, b) => 0.5 * Math.sin(s * 0.21 + a) + 0.3 * Math.sin(s * 0.67 + b);
      const ys = [h, h - 0.45, Math.min(h - 1.4, 0.8 + w(3, 4) * 1.6), BOTTOM];
      for (let j = 1; j < 3; j++) ys[j] = Math.max(BOTTOM + 0.5, Math.min(ys[j], ys[j - 1] - 0.15));
      cols.push({ x, z, s, ys, n: rand(), w: waterAt(x, z) });
    }
    const cW = new THREE.Color(0x4a6e7c);
    for (let k = 0; k < N - 1; k++) {
      const A = cols[k], B = cols[k + 1];
      // 단면에 드러난 시냇물
      if (A.w > A.ys[0] || B.w > B.ys[0]) quad(water, A, B, Math.max(A.w, A.ys[0]), A.ys[0], Math.max(B.w, B.ys[0]), B.ys[0], e.n, cW);
      for (let b = 0; b < 3; b++) {
        const c = LAYERS[b].clone().multiplyScalar(0.92 + A.n * 0.16);

      }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(o.pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(o.nor, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(o.col, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(o.uv, 2));
    scene.add(new THREE.Mesh(geo, lambert({ vertexColors: true, map })));
  }
}

// 시냇물: 물길을 따라 흐르는 잔물결과 반짝임. 둑 지형이 가장자리를 가린다
{
  // 수면은 지형 격자(1m 간격) 위에 깔고 둑 지형이 가장자리를 가린다: 넓고 굽은 곳에서도 접히지 않고, 보드 경계에서 그대로 끊긴다
  const pos = [], uv = [], idx = [], K = 2, M = (N - 1) / K + 1, vid = new Int32Array(M * M).fill(-1);
  const near = (i) => creekD[i] < CREEK_HW + 2.5;
  const vert = (mx, mz) => {
    const k = mz * M + mx;
    if (vid[k] < 0) {
      const i = mz * K * N + mx * K;
      vid[k] = pos.length / 3;
      pos.push(-HALF + mx * K * STEP, waterY[i], -HALF + mz * K * STEP);
      uv.push(creekLat[i], creekS[i], creekWd[i], creekD[i]);
    }
    return vid[k];
  };
  for (let mz = 0; mz < M - 1; mz++) for (let mx = 0; mx < M - 1; mx++) {
    const i00 = mz * K * N + mx * K, i10 = i00 + K, i01 = i00 + K * N, i11 = i01 + K;
    if (!(near(i00) || near(i10) || near(i01) || near(i11))) continue;
    const a = vert(mx, mz), b = vert(mx + 1, mz), c = vert(mx, mz + 1), d = vert(mx + 1, mz + 1);
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('aW', new THREE.Float32BufferAttribute(uv, 4));
  geo.setIndex(idx); geo.computeVertexNormals();
  const mat = ps1(new THREE.MeshLambertMaterial({ color: 0x6f9aa6, transparent: true, opacity: 0.2, depthWrite: false, side: THREE.DoubleSide }), (sh) => {
    sh.uniforms.uTime = U.uTime;
    sh.vertexShader = 'attribute vec4 aW; varying vec4 vW;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvW = aW;');
    sh.fragmentShader = `uniform float uTime; varying vec4 vW;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vnoise(vec2 p) {
        vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
      }
    ` + sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      if (vW.w > ${(CREEK_HW + 2.0).toFixed(1)}) discard;   // 물길 밖으로는 그리지 않는다
      vec2 fl = vec2(vW.x * 1.3, vW.y * 0.9 + ${CREEK_UP.toFixed(1)} * uTime * 1.1);   // 상류에서 하류로
      float rip = vnoise(fl * 1.6) * 0.6 + vnoise(fl * 4.0 + vec2(uTime * 0.3, 0.0)) * 0.4;
      float glint = smoothstep(0.72, 0.8, rip);
      float foam = smoothstep(${(CREEK_HW - 0.6).toFixed(2)}, ${(CREEK_HW + 0.4).toFixed(2)}, abs(vW.x) - vW.z + (vnoise(fl * 2.5) - 0.5) * 0.8);
      diffuseColor.rgb *= 0.85 + 0.3 * rip;
      diffuseColor.a = min(1.0, diffuseColor.a + glint * 0.5 + foam * 0.35);   // 반짝임과 거품만 진하게 떠 흐른다
      totalEmissiveRadiance += vec3(0.5, 0.62, 0.7) * glint * 0.5 + vec3(0.35) * foam * 0.25;`);
  }, 'water');
  const water = new THREE.Mesh(geo, mat);
  water.renderOrder = -1;   // 투명 물체 중 가장 먼저 그려서, 물 위에 겹친 연기·불꽃을 덮지 않게
  scene.add(water);
  // 물속/둑의 돌멩이
  const stones = [];
  for (let k = 0; k < 140; k++) {
    const p = creekPoly[2 + Math.floor(rand() * (creekPoly.length - 4))];
    const off = rr(-p.w - 1.2, p.w + 1.2), x = p.x + rr(-0.4, 0.4), z = p.z + off;
    if (Math.abs(x) > HALF - 0.5 || Math.abs(z) > HALF - 0.5 || Math.hypot(x - BRIDGE.x, z - BRIDGE.z) < 4) continue;
    const g = new THREE.DodecahedronGeometry(rr(0.12, 0.38), 0);
    g.scale(1, rr(0.4, 0.7), rr(0.7, 1.2)); g.rotateY(rand() * 6.28);
    g.translate(x, heightAt(x, z) + 0.02, z);
    stones.push(g.index ? g.toNonIndexed() : g);
  }
  scene.add(new THREE.Mesh(mergeGeometries(stones), lambert({ color: 0x6e6a60, flatShading: true })));
}

// ---------------------------------------------------------------- 텍스처 헬퍼
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
// 손으로 켠 판자: 폭이 제각각이고 이음매가 살짝 들쭉날쭉, 맞댄 자리·옹이·못 자국
const plankTex = canvasTex(64, 64, (g) => {
  const ws = [];
  for (let t = 0; t < 64;) { const w = Math.min(64 - t, 5 + Math.floor(rand() * 5)); ws.push(w); t += w; }
  if (ws[ws.length - 1] < 4) { ws[ws.length - 2] += ws.pop(); }
  let y = 0;
  for (const w of ws) {
    const v = 175 + Math.floor(rand() * 65);
    g.fillStyle = `rgb(${v},${v - 4},${v - 8})`; g.fillRect(0, y, 64, w);
    // 결
    for (let k = 0; k < 10; k++) {
      g.fillStyle = `rgba(0,0,0,${0.05 + rand() * 0.15})`;
      g.fillRect(Math.floor(rand() * 64), y + 1 + Math.floor(rand() * (w - 2)), 3 + Math.floor(rand() * 12), 1);
    }
    // 아래 이음매: 몇 픽셀마다 한 칸씩 오르내린다
    g.fillStyle = 'rgba(0,0,0,.5)';
    let off = 0;
    for (let x = 0; x < 64;) {
      const run = 6 + Math.floor(rand() * 14);
      g.fillRect(x, y + w - 1 + off, run, 1);
      x += run; off = off === 0 ? (rand() < 0.5 ? -1 : 0) : 0;
    }
    // 맞댄 자리 + 못
    for (let k = 0; k < 1 + Math.floor(rand() * 2); k++) {
      const jx = Math.floor(rand() * 64);
      g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(jx, y, 1, w - 1);
      g.fillStyle = 'rgba(30,20,10,.7)'; g.fillRect(jx - 2, y + 1, 1, 1); g.fillRect(jx + 2, y + w - 3, 1, 1);
    }
    if (rand() < 0.35) { g.fillStyle = 'rgba(40,25,10,.45)'; g.fillRect(Math.floor(rand() * 60), y + Math.floor(w / 2) - 1, 2, 2); }
    y += w;
  }
}, true);
const windowTex = (lit, bars) => canvasTex(16, 20, (g) => {
  g.fillStyle = '#2a1c12'; g.fillRect(0, 0, 16, 20);
  if (lit) { const gr = g.createLinearGradient(0, 2, 0, 18); gr.addColorStop(0, '#ffe09a'); gr.addColorStop(1, '#e8963e'); g.fillStyle = gr; }
  else g.fillStyle = '#1c2332';
  g.fillRect(2, 2, 12, 16);
  g.fillStyle = '#2a1c12'; g.fillRect(7, 2, 2, 16); g.fillRect(2, 9, 12, 2);
  if (bars) for (let x = 3; x < 14; x += 3) g.fillRect(x, 2, 1, 16);
});
const signTex = (text, bg, fg) => canvasTex(128, 28, (g) => {
  g.fillStyle = bg; g.fillRect(0, 0, 128, 28);
  g.strokeStyle = '#2a1a10'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, 125, 25);
  g.fillStyle = fg; g.font = 'bold 19px Georgia, "Times New Roman", serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 64, 15);
  for (let i = 0; i < 140; i++) { g.fillStyle = `rgba(70,45,20,${rand() * 0.3})`; g.fillRect(rand() * 128, rand() * 28, 1 + rand() * 3, 1); }
});
const glowTex = canvasTex(32, 32, (g) => {
  const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, 'rgba(255,230,170,1)'); gr.addColorStop(0.3, 'rgba(255,190,100,.45)'); gr.addColorStop(1, 'rgba(255,160,60,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
});

const matCache = new Map();
function woodMat(color) {
  if (!matCache.has(color)) matCache.set(color, lambert({ map: plankTex, color, side: THREE.DoubleSide }));
  return matCache.get(color);
}
// 지붕 널: 엇갈려 겹친 너와 줄, 줄마다 아래쪽 그림자, 가끔 빠지거나 색이 다른 조각
const shingleTex = canvasTex(64, 64, (g) => {
  for (let row = 0; row < 8; row++) {
    const y = row * 8, off = (row % 2) * 5;
    for (let x = -off; x < 64; ) {
      const w = 7 + Math.floor(rand() * 7), v = 150 + Math.floor(rand() * 70);
      g.fillStyle = `rgb(${v},${v - 6},${v - 12})`; g.fillRect(x, y, w, 8);
      g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(x + w - 1, y, 1, 7);       // 조각 사이 틈
      if (rand() < 0.5) { g.fillStyle = 'rgba(0,0,0,.15)'; g.fillRect(x + 2, y + 1 + Math.floor(rand() * 4), 1, 3); }
      if (rand() < 0.04) { g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(x, y, w, 8); }   // 빠진 조각

  const pct = (v) => `${Math.round(Math.min(1, v) * 100)}%`;
  const left = MAX_DROPS + 1 - enemyKills;
  const t = `내 탱크 피해 ${tank.solid || tank.falling ? pct(tank.hp) : '파괴'} · 적 ${left > 0 ? `남은 ${left}대` : '전멸'}` +
    (enemy.solid ? ` · 적 피해 ${pct(enemy.hp)}` : enemy.falling ? ' · 적 낙하 중' : enemyTimer > 0 ? ' · 적 증원 대기' : '');
  if (t !== battleTxt) battleEl.textContent = battleTxt = t;
}

function tick(dt) {
  U.uTime.value += dt;
  // 바람 방향이 천천히 바뀐다
  const a = 0.65 + Math.sin(U.uTime.value * 0.05) * 0.4;
  U.uWindDir.value.set(Math.cos(a), Math.sin(a));

  // 입력 → 물리
  const thr = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
  const steer = (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0) - (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0);
  const turn = thr < 0 ? -steer : steer;   // 후진할 땐 자동차처럼 좌우가 반대
  const de = (keys.has('ArrowUp') ? 1 : 0) - (keys.has('ArrowDown') ? 1 : 0);
  tank.elev = Math.max(-0.1, Math.min(0.96, tank.elev + de * 0.55 * dt));
  const tq = (keys.has('KeyQ') ? 1 : 0) - (keys.has('KeyE') ? 1 : 0);   // 포탑 회전: Q 왼쪽, E 오른쪽
  if (tank.solid) turretStep(tank, tq, dt);
  setBrake(tank, thr, tank.solid);
  tank.cool -= dt;
  if (tank.solid && keys.has('Space') && tank.cool <= 0) { fireCannon(); tank.cool = 1.8; }
  if (tank.falling) updateFall(tank, dt);
  if (enemy.falling) updateFall(enemy, dt);
  if (enemyTimer > 0 && (enemyTimer -= dt) <= 0) startDrop(enemy);   // 5초 뒤 증원이 하늘에서
  const ai = enemy.solid ? enemyAI(enemy, dt) : _eAim;
  for (const T of TANKS) T.wet = T.pos.y - COM.y < waterAt(T.pos.x, T.pos.z) + 0.1;   // 차체 바닥이 물에 잠기면 감속
  for (physAcc += dt; physAcc >= PHYS_H; physAcc -= PHYS_H) {
    if (tank.solid) physStep(PHYS_H, thr, turn);
    if (enemy.solid) physStep(PHYS_H, ai.thr, ai.turn, enemy);
  }
  if (tank.solid && tank.pos.y < BOTTOM - 20) spawnTank();
  if (enemy.solid && enemy.pos.y < BOTTOM - 20) startDrop(enemy);
  if (enemy.solid) enemyVisual(enemy, dt, ai.thr);
  setBrake(enemy, ai.thr, enemy.solid);
  updateBattleHud();
  const ta = Math.round(THREE.MathUtils.radToDeg(Math.atan2(Math.sin(tank.tyaw || 0), Math.cos(tank.tyaw || 0))));   // -180~180, + = 왼쪽
  if (ta !== turretAngShown) { turretAngShown = ta; turretAngEl.textContent = (ta > 0 ? '좌 ' : ta < 0 ? '우 ' : '') + Math.abs(ta) + '°'; }

  // 탱크 표시: 궤도 텍스처를 벨트 이동 거리만큼 흘린다
  tank.dL += tank.sL * dt; tank.dR += tank.sR * dt;
  parts.belts[0].offset.x = tank.dL / TREAD; parts.belts[1].offset.x = tank.dR / TREAD;
  tank.recoil = Math.max(0, tank.recoil - dt * 3);
  parts.barrel.position.z = -0.5 * tank.recoil;
  syncTankVisual();

  trampleUnder(tank);
  driveEffects(dt);
  if (tank.solid) exhaust(dt, thr, turn);

  updateBalls(dt);
  spawnFire(dt);
  glowP.update(dt); smokeP.update(dt);
  for (fieldAcc += dt; fieldAcc >= 0.05; fieldAcc -= 0.05) fieldTick(0.05);
  updateTrackMap(dt);
  updateTargets(dt); updateShadows(); updateCoins(dt); updateSmokers(dt); updateCrates(dt); updateWires(dt); updateWallDecals(dt); updateWindmill(dt);
  updateLights(dt);
  updateAim();
  updateCollisionView();
}
window.dbg.tick = tick;
Object.assign(window.dbg, { enemy, TANKS, startDrop, destroyTankBody, hitTank, spawnCoins, coins, battle: () => ({ enemyDrops, enemyKills, enemyTimer, missionClear, gold }), targets });
aoSave();   // 이번에 새로 구운 AO가 있으면 저장 (다음 로딩부터 바로 씀)
// 브라우저 창이 활성 상태가 아니면 일시정지 (다른 창을 보는 동안 적에게 당하지 않게). 마지막 화면은 그대로 남는다
const pauseEl = document.getElementById('pauseMsg');
let paused = false, pausedDrawn = false;
const setPaused = (v) => { paused = v; pausedDrawn = false; pauseEl.style.display = v ? 'block' : 'none'; };
addEventListener('blur', () => setPaused(true));
addEventListener('focus', () => setPaused(false));
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); else if (document.hasFocus()) setPaused(false); });
if (!document.hasFocus()) setPaused(true);
renderer.setAnimationLoop(() => {
  // 멈춘 동안은 시간도 흐르지 않게 (재개 때 한꺼번에 몰아 계산하지 않음). 화면은 멈춘 직후 한 번만 그린다
  // (비활성 창에서 처음 열려도 빈 화면이 아니게)
  if (paused && pausedDrawn) { clock.getDelta(); return; }
  const dt = paused ? 0 : Math.min(clock.getDelta(), 0.05);
  if (paused) pausedDrawn = true;
  tick(dt);   // 멈춰 있을 때는 dt = 0: 모델 위치만 맞추고 시간은 그대로

  // 카메라 추적 + 흔들림
  _tmp.copy(tank.pos).sub(lastFollow);
  camera.position.add(_tmp); controls.target.add(_tmp); lastFollow.copy(tank.pos);
  followYaw(dt);
  controls.update();
  shake = Math.max(0, shake - dt * 2.5);
  _shake.set(rr(-1, 1), rr(-1, 1), rr(-1, 1)).multiplyScalar(shake * 0.35);
  camera.position.add(_shake);

  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  const calls = renderer.info.render.calls, tris = renderer.info.render.triangles;
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
  camera.position.sub(_shake);

  frames++; acc += dt;
  if (acc > 0.5) {
    const spd = Math.hypot(tank.vel.x, tank.vel.z) * 3.6;
    statsEl.textContent = `${Math.round(frames / acc)} fps · ${rt.width}x${rt.height} · 광원 ${lightCount} · draw ${calls} · tri ${(tris / 1000).toFixed(0)}k · ` +
      `포각 ${Math.round(THREE.MathUtils.radToDeg(tank.elev))}° · ${spd.toFixed(0)} km/h`;
    frames = 0; acc = 0;
  }
});
</script>
</body>
</html>
